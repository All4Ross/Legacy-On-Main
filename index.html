  <style>

    @media(max-width:650px){header{align-items:flex-start;flex-direction:column;padding:24px 6vw}main{padding:0 3vw 20px}figcaption{padding:14px;flex-direction:column;gap:6px}footer{padding:10px 6vw 24px}}
